<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - ชำระเงินสำเร็จ</title>
    <style>
        body { background-color: #d2b48c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .thank-you-card { background: white; padding: 40px; border-radius: 30px; text-align: center; border: 5px solid #8b4513; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 350px; animation: popIn 0.5s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .success-icon { width: 80px; height: 80px; background-color: #28a745; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(40,167,69,0.3); }
        h1 { color: #8b4513; margin: 0; font-size: 28px; }
        h2 { color: #28a745; margin: 10px 0; font-size: 24px; }
        p  { color: #555; margin-bottom: 20px; line-height: 1.6; }
        .back-home-btn { display: inline-block; padding: 15px 40px; background-color: #8b4513; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; cursor: pointer; font-size: 18px; }
        .back-home-btn:hover { background-color: #a0522d; transform: translateY(-3px); }
        .queue-info { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 10px 15px; font-size: 14px; color: #856404; margin: 15px 0; display: none; }
        .voice-hint { margin-top: 20px; padding: 10px; background: #fdf5e6; border-radius: 10px; font-size: 14px; color: #8b4513; }
        .voice-hint b { color: #b52b2b; }
        #voice-indicator { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.92); text-align: center; padding: 6px; font-size: 14px; color: #8b4513; font-weight: bold; display: none; z-index: 999; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div id="voice-indicator"></div>

<div class="thank-you-card">
    <div class="success-icon">✓</div>
    <h1>Thank You!</h1>
    <h2>ชำระเงินสำเร็จ</h2>
    <p>ได้รับคำสั่งซื้อของคุณเรียบร้อยแล้ว<br>กรุณารอรับเครื่องดื่มสักครู่ครับ</p>

    <!-- Feature 1: แสดงคิว -->
    <div class="queue-info" id="queueInfo"></div>

    <button class="back-home-btn" onclick="window.location.href='index.html'">กลับหน้าหลัก</button>

    <div class="voice-hint">
        🎤 พูดว่า <b>"หน้าแรก"</b> หรือ <b>"สั่งใหม่"</b>
    </div>
</div>

<script>
// ─── TTS (Feature 2) ──────────────────────────────────────────────────────────
let isSpeaking = false;
let recognitionRef = null;

function aiSpeak(msg) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    // ไม่ abort() ไมค์ — ปล่อยให้ recognition ฟังต่อเนื่อง (ไม่ต้อง restart ให้หน่วง)
    // แค่กรองผลลัพธ์ทิ้งระหว่างพูดด้วย isSpeaking เพื่อกันเสียงจากลำโพงวิ่งกลับเข้าไมค์ (echo)
    isSpeaking = true;

    const u = new SpeechSynthesisUtterance(msg);
    u.lang = 'th-TH'; u.rate = 1.0; u.volume = 1;
    u.onend = () => {
        // รอสั้นๆ ให้ echo หางเสียงสลายก่อน ค่อยเริ่มรับฟังคำตอบจริง
        setTimeout(() => { isSpeaking = false; }, 200);
    };
    window.speechSynthesis.speak(u);
}

// ─── On Load ──────────────────────────────────────────────────────────────────
window.onload = () => {
    localStorage.clear();

    // Feature 2: พูดขอบคุณ
    setTimeout(() => aiSpeak('ชำระเงินสำเร็จแล้วครับ กรุณารอรับเครื่องดื่มของคุณสักครู่'), 300);

    // Feature 1: แสดงคิวรอ
    fetch('/api/queue')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('queueInfo');
            if (data.queue_size > 0) {
                const mins = Math.ceil(data.wait_seconds / 60);
                el.textContent = `⏳ มีคิวรออยู่ ${data.queue_size} แก้ว — รอประมาณ ${mins} นาที`;
            } else {
                el.textContent = '✅ กำลังเตรียมเครื่องดื่มของคุณ';
            }
            el.style.display = 'block';
        })
        .catch(() => {});
};

// ─── AI Voice Assistant ───────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognitionRef = recognition; // ให้ aiSpeak() เข้าถึงได้
    recognition.lang = 'th-TH';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;

    const voiceIndicator = document.getElementById('voice-indicator');
    let lastActed = 0;

    recognition.onstart = () => {
        voiceIndicator.style.display = 'block';
        voiceIndicator.innerHTML = '🎙️ AI พร้อมรับคำสั่งเสียงแล้ว...';
    };

    recognition.onresult = (event) => {
        if (isSpeaking) return; // ไม่รับเสียงขณะ TTS กำลังพูด (ป้องกัน echo)
        const now = Date.now();
        if (now - lastActed < 2000) return;

        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++)
            transcript += event.results[i][0].transcript;
        transcript = transcript.toLowerCase().trim();
        if (!transcript) return;
        console.log('AI ได้ยิน:', transcript);
        voiceIndicator.style.display = 'block';
        voiceIndicator.innerHTML = `🎙️ ได้ยิน: "${transcript}"`;

        if (['หน้าแรก','แรก','กลับ','สั่งใหม่','เอาอีก','เมนู','ตกลง','ไปหน้าหลัก','home','menu','again','new order','โฮม','อะเกน','นิว ออเดอร์','แบ็ค' ].some(w => transcript.includes(w))) {
            lastActed = now;
            voiceIndicator.innerHTML = '✅ กำลังกลับหน้าหลัก...';
            setTimeout(() => { window.location.href = 'index.html'; }, 400);
        }
    };

    recognition.onerror = (e) => { if (e.error !== 'aborted' && !isSpeaking) setTimeout(() => recognition.start(), 300); };
    recognition.onend = () => { if (!isSpeaking) recognition.start(); };
    recognition.start();
}
</script>
</body>
</html>
