<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #d2b48c;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 40px;
        }

        .header {
            width: 100%;
            background-color: #8b4513;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            top: 0; left: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        .header h1 { margin: 0; font-size: 22px; }
        .header a {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%);
            color: white; text-decoration: none; font-size: 14px; opacity: 0.85;
        }

        .page-content {
            margin-top: 20px;
            padding: 20px;
            max-width: 820px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Stats row */
        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            border: 3px solid #8b4513;
            border-radius: 15px;
            padding: 14px 20px;
            flex: 1;
            min-width: 130px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .stat-card .num  { font-size: 28px; font-weight: bold; color: #8b4513; }
        .stat-card .lbl  { font-size: 12px; color: #888; margin-top: 4px; }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar select {
            padding: 8px 12px;
            border: 2px solid #8b4513;
            border-radius: 20px;
            background: white;
            font-size: 14px;
            color: #8b4513;
            font-weight: bold;
            cursor: pointer;
        }

        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-refresh { background: #8b4513; color: white; }
        .btn-refresh:hover { background: #6b3410; }
        .btn-export  { background: #28a745; color: white; }
        .btn-export:hover  { background: #1e7e34; }
        .btn-reset   { background: #b52b2b; color: white; }
        .btn-reset:hover   { background: #8b0000; }

        /* Table card */
        .card {
            background: white;
            border: 3px solid #8b4513;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background-color: #8b4513;
            color: white;
        }

        th, td {
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
        }

        th { font-weight: bold; letter-spacing: 0.5px; }

        tbody tr:nth-child(even) { background-color: #fdf5e6; }
        tbody tr:hover { background-color: #f0e0c8; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge-blue      { background: #007bff; }
        .badge-red       { background: #b52b2b; }
        .badge-green     { background: #28a745; }
        .badge-completed      { background: #28a745; }
        .badge-cancelled      { background: #888; }
        .badge-pending_payment { background: #e0a800; }
        .badge-test           { background: #6c5ce7; }

        .sweet-bar-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sweet-bar {
            height: 8px;
            border-radius: 4px;
            background: #8b4513;
            opacity: 0.7;
        }

        .cancel-btn {
            background: none;
            border: 1px solid #b52b2b;
            color: #b52b2b;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 3px 10px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .cancel-btn:hover { background: #ffe6e6; }
        .cancel-btn:disabled { opacity: 0.4; cursor: default; }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">← Back</a>
        <h1>📋 Order History</h1>
    </div>

    <div class="page-content">

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="statTotal">—</div>
                <div class="lbl">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statRevenue" style="color:#8b4513;">—</div>
                <div class="lbl">Total Revenue (฿)</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statBlue" style="color:#007bff;">—</div>
                <div class="lbl">Blue Syrup</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statRed" style="color:#b52b2b;">—</div>
                <div class="lbl">Red Syrup</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statGreen" style="color:#28a745;">—</div>
                <div class="lbl">Green Syrup</div>
            </div>
        </div>

        <!-- Charts (Feature 4) -->
        <div id="chartsSection" style="display:none; margin-bottom:20px;">
            <div style="display:flex; gap:15px; flex-wrap:wrap;">
                <div style="background:white; border:3px solid #8b4513; border-radius:15px; padding:20px; flex:1; min-width:200px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
                    <p style="margin:0 0 12px; color:#8b4513; font-size:13px; font-weight:bold; text-align:center;">Flavor Distribution</p>
                    <canvas id="flavorChart"></canvas>
                </div>
                <div style="background:white; border:3px solid #8b4513; border-radius:15px; padding:20px; flex:1; min-width:200px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
                    <p style="margin:0 0 12px; color:#8b4513; font-size:13px; font-weight:bold; text-align:center;">Sweetness Levels</p>
                    <canvas id="sweetnessChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <select id="filterFlavor" onchange="renderTable()">
                <option value="">All Flavors</option>
                <option value="Blue Syrup">Blue Syrup</option>
                <option value="Red Syrup">Red Syrup</option>
                <option value="Green Syrup">Green Syrup</option>
            </select>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-refresh" onclick="loadOrders()">↻ Refresh</button>
                <button class="btn" id="chartToggleBtn" style="background:#6b3410; color:white;" onclick="toggleCharts()">📊 Charts</button>
                <button class="btn btn-export"  onclick="exportCSV()">⬇ Export CSV</button>
                <button class="btn btn-reset"   onclick="resetAllOrders()">🗑 Reset All</button>
            </div>
        </div>

        <!-- Table -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Flavor</th>
                        <th>Sweetness</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Date / Time</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="orderBody">
                    <tr><td colspan="6" class="empty-msg">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let allOrders = [];
        let flavorChart = null;
        let sweetnessChart = null;

        function toggleCharts() {
            const section = document.getElementById('chartsSection');
            const visible = section.style.display !== 'none';
            section.style.display = visible ? 'none' : 'block';
            document.getElementById('chartToggleBtn').textContent = visible ? '📊 Charts' : '📊 Hide';
            if (!visible) renderCharts();
        }

        function renderCharts() {
            const active = allOrders.filter(o => o.order_status !== 'cancelled');

            const flavorData = [
                active.filter(o => o.flavor === 'Blue Syrup').length,
                active.filter(o => o.flavor === 'Red Syrup').length,
                active.filter(o => o.flavor === 'Green Syrup').length,
            ];
            const sweetnessData = [
                active.filter(o => o.sweetness_level === 'หวานน้อย').length,
                active.filter(o => o.sweetness_level === 'หวานปกติ').length,
                active.filter(o => o.sweetness_level === 'หวานมาก').length,
            ];

            if (flavorChart) flavorChart.destroy();
            flavorChart = new Chart(document.getElementById('flavorChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Blue Syrup', 'Red Syrup', 'Green Syrup'],
                    datasets: [{ data: flavorData, backgroundColor: ['#007bff','#b52b2b','#28a745'], borderWidth: 2 }]
                },
                options: { plugins: { legend: { position: 'bottom' } }, responsive: true }
            });

            if (sweetnessChart) sweetnessChart.destroy();
            sweetnessChart = new Chart(document.getElementById('sweetnessChart'), {
                type: 'bar',
                data: {
                    labels: ['หวานน้อย', 'หวานปกติ', 'หวานมาก'],
                    datasets: [{ data: sweetnessData, backgroundColor: ['#5bc0de','#8b4513','#d9534f'], borderRadius: 8 }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    responsive: true
                }
            });
        }

        function badgeClass(flavor) {
            if (flavor === 'Blue Syrup')  return 'badge-blue';
            if (flavor === 'Red Syrup')   return 'badge-red';
            if (flavor === 'Green Syrup') return 'badge-green';
            return 'badge-blue';
        }

        function sweetLabel(level) {
            if (level === 'หวานน้อย')  return 'Low';
            if (level === 'หวานปกติ') return 'Normal';
            if (level === 'หวานมาก')  return 'High';
            return level;
        }

        function sweetBarWidth(pct) {
            // map 50–150 → 20–100px
            return Math.round(20 + ((pct - 50) / 100) * 80);
        }

        function renderTable() {
            const filter = document.getElementById('filterFlavor').value;
            const rows   = filter ? allOrders.filter(o => o.flavor === filter) : allOrders;
            const tbody  = document.getElementById('orderBody');

            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map((o, i) => `
                <tr>
                    <td style="color:#aaa; font-size:12px;">${rows.length - i}</td>
                    <td><span class="badge ${badgeClass(o.flavor)}">${o.flavor}</span></td>
                    <td>${sweetLabel(o.sweetness_level)}</td>
                    <td style="font-weight:bold; color:#8b4513;">฿${Number(o.price).toFixed(2)}</td>
                    <td><span class="badge badge-${o.order_status}">${o.order_status}</span></td>
                    <td style="color:#555; font-size:13px;">${o.ordered_at}</td>
                    <td>
                        <button class="cancel-btn" onclick="cancelOrder(${o.id})"
                            ${o.order_status === 'cancelled' ? 'disabled' : ''}>ยกเลิก</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const active = allOrders.filter(o => o.order_status === 'completed');
            const revenue = active.reduce((sum, o) => sum + Number(o.price), 0);
            document.getElementById('statTotal').textContent   = active.length;
            document.getElementById('statRevenue').textContent = revenue.toFixed(2);
            document.getElementById('statBlue').textContent    = active.filter(o => o.flavor === 'Blue Syrup').length;
            document.getElementById('statRed').textContent     = active.filter(o => o.flavor === 'Red Syrup').length;
            document.getElementById('statGreen').textContent   = active.filter(o => o.flavor === 'Green Syrup').length;
        }

        function loadOrders() {
            fetch('/api/orders')
                .then(r => r.json())
                .then(data => {
                    allOrders = data;
                    updateStats();
                    renderTable();
                    if (document.getElementById('chartsSection').style.display !== 'none') renderCharts();
                })
                .catch(() => {
                    document.getElementById('orderBody').innerHTML =
                        '<tr><td colspan="6" class="empty-msg">Failed to load orders.</td></tr>';
                });
        }

        function cancelOrder(id) {
            if (!confirm(`ยกเลิกออเดอร์ #${id}?`)) return;
            fetch(`/api/orders/${id}/cancel`, { method: 'POST' })
                .then(r => r.json())
                .then(() => loadOrders());
        }

        function exportCSV() {
            window.location.href = '/api/orders/export';
        }

        function resetAllOrders() {
            if (!confirm('ลบออเดอร์ทั้งหมดและรีเซ็ตเลข ID ใช่ไหม?\nดำเนินการนี้ไม่สามารถย้อนกลับได้')) return;
            fetch('/api/orders/reset', { method: 'DELETE' })
                .then(r => r.json())
                .then(() => loadOrders());
        }

        loadOrders();
    </script>

</body>
</html>
