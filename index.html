<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Page with Voice Control</title>

    <style>
        body {
            background-color: #d2b48c;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 40px;
        }

        .header {
            width: 100%;
            background-color: #8b4513;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 { margin: 0; font-size: 24px; }
        .header { position: relative; }

        /* แถบแจ้งเตือนสถานะเสียง */
        #voice-indicator {
            position: fixed;
            top: 65px;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 5px;
            font-size: 14px;
            color: #8b4513;
            font-weight: bold;
            display: none;
            z-index: 999;
        }

        .container {
            margin-top: 100px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .menu-btn {
            background-color: white;
            border: 3px solid #8b4513;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 140px;
            height: 140px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .menu-btn:hover {
            background-color: #f4e4c1;
            transform: translateY(-5px);
        }

        .menu-icon { font-size: 50px; }

        .menu-name {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #8b4513;
            text-align: center;
            padding: 0 5px;
        }

        .empty-msg { text-align: center; color: #8b4513; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>What would you like to order from the menu?</h1>
        <a href="config.html"
           style="position:absolute; right:20px; top:50%; transform:translateY(-50%);
                  color:white; font-size:22px; text-decoration:none; opacity:0.85;"
           title="ตั้งค่า / จัดการเมนู">⚙️</a>
        <a href="orders.html"
           style="position:absolute; left:20px; top:50%; transform:translateY(-50%);
                  color:white; font-size:22px; text-decoration:none; opacity:0.85;"
           title="Order History">📋</a>
    </div>

    <div id="voice-indicator">🎙️ กำลังฟังคำสั่งเสียง </div>

    <div class="container" id="menu-container"></div>

<script>
    // เมนูทั้งหมดโหลดจากเซิร์ฟเวอร์ (ตั้งค่า/จัดการเมนูได้ที่หน้า config.html)
    let menus = [];

    // หน้าเฉพาะสำหรับ 3 เมนูดั้งเดิม ส่วนเมนูใหม่ที่เพิ่มเองจะใช้หน้า drink.html แบบทั่วไป
    const DEDICATED_PAGES = {
        'Blue Syrup':  'blue.html',
        'Red Syrup':   'red.html',
        'Green Syrup': 'green.html',
    };

    function pageFor(menu) {
        return DEDICATED_PAGES[menu.name] || ('drink.html?menu=' + encodeURIComponent(menu.name));
    }

    function renderMenus() {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';

        if (menus.length === 0) {
            container.innerHTML = '<p class="empty-msg">ยังไม่มีเมนู — เพิ่มเมนูได้ที่หน้าตั้งค่า ⚙️</p>';
            return;
        }

        menus.forEach((menu) => {
            const div = document.createElement('div');
            div.className = 'menu-btn';
            div.innerHTML = `<div class="menu-icon">${menu.icon || '🍽️'}</div><div class="menu-name">${menu.name}</div>`;
            div.onclick = () => { window.location.href = pageFor(menu); };
            container.appendChild(div);
        });
    }

    function loadMenus() {
        fetch('/api/menus')
            .then(r => r.json())
            .then(data => {
                menus = data;
                renderMenus();
                buildIntentMap();
            })
            .catch(err => {
                console.error('โหลดเมนูไม่สำเร็จ:', err);
                document.getElementById('menu-container').innerHTML =
                    '<p class="empty-msg">โหลดเมนูไม่สำเร็จ</p>';
            });
    }

    // =========================================================
    // ระบบสั่งการด้วยเสียง + AI Intent Matcher (คีย์เวิร์ดมาจากการตั้งค่าเมนู)
    // =========================================================
    let intentMap = [];

    function buildIntentMap() {
        intentMap = menus.map(menu => ({
            page: pageFor(menu),
            keywords: [menu.name.toLowerCase(), ...(menu.keywords || []).map(k => k.toLowerCase())],
        }));
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'th-TH';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 3;

        let lastActed = 0;

        function aiProcess(text) {
            for (let item of intentMap) {
                if (item.keywords.some(word => text.includes(word))) return item.page;
            }
            return null;
        }

        recognition.onstart = () => {
            document.getElementById('voice-indicator').style.display = 'block';
            document.getElementById('voice-indicator').innerHTML = "🎙️ AI พร้อมรับคำสั่งเสียงแล้ว...";
        };

        recognition.onresult = (event) => {
            const now = Date.now();
            if (now - lastActed < 2000) return;

            for (let i = event.resultIndex; i < event.results.length; i++) {
                // ตรวจสอบทุก alternative ไม่ใช่แค่อันดับ 1
                for (let j = 0; j < event.results[i].length; j++) {
                    const transcript = event.results[i][j].transcript.toLowerCase().trim();
                    if (!transcript) continue;
                    console.log("AI ได้ยินว่า:", transcript);

                    const targetPage = aiProcess(transcript);
                    if (targetPage) {
                        lastActed = now;
                        document.getElementById('voice-indicator').innerHTML = `✅ รับทราบ: "${transcript}" กำลังเปิด...`;
                        setTimeout(() => { window.location.href = targetPage; }, 400);
                        return;
                    }
                }

                // แสดง "ไม่พบ" เฉพาะผลลัพธ์สุดท้าย (final) เท่านั้น
                if (event.results[i].isFinal) {
                    const topText = event.results[i][0].transcript;
                    document.getElementById('voice-indicator').innerHTML = `❓ ไม่พบเมนู "${topText}" ลองใหม่อีกครั้ง`;
                    setTimeout(() => {
                        document.getElementById('voice-indicator').innerHTML = "🎙️ กำลังฟังคำสั่งเสียง...";
                    }, 2000);
                }
            }
        };

        recognition.onerror = (e) => {
            if (e.error !== 'aborted') setTimeout(() => recognition.start(), 300);
        };
        recognition.onend = () => recognition.start();
        recognition.start();

    } else {
        console.warn("เบราว์เซอร์นี้ไม่รองรับระบบสั่งการด้วยเสียง");
    }

    loadMenus();
</script>

</body>
</html>
